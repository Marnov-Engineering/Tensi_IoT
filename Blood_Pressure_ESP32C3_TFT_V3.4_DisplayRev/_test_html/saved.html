<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MamaCare — Tersimpan</title>
<style>
:root{
  --orange:#F5A623;
  --orange-dark:#E09010;
  --orange-light:#FDE9C0;
  --navy:#1C2D6C;
  --navy-light:#2A3F8F;
  --white:#FFFFFF
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:linear-gradient(150deg,var(--orange-light) 0%,var(--orange) 60%,var(--orange-dark) 100%);
  min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:20px
}
.card{
  background:var(--white);border-radius:24px;
  padding:40px 28px;width:100%;max-width:400px;
  box-shadow:0 16px 48px rgba(28,45,108,.25);text-align:center
}
.brand{font-size:1.1rem;font-weight:800;color:var(--orange-dark);margin-bottom:14px;letter-spacing:.02em}
h1{font-size:1.45rem;color:var(--navy);font-weight:800;margin-bottom:10px}
.lbl{color:#8A8FA8;font-size:.84rem;margin-bottom:8px}
.ssid{
  display:inline-block;background:var(--orange-light);
  color:var(--navy);font-weight:700;font-size:.95rem;
  padding:7px 20px;border-radius:10px;margin-bottom:18px;
  border:1.5px solid var(--orange)
}
p{color:#555;font-size:.88rem;line-height:1.65}
.note{margin-top:18px;font-size:.78rem;color:#A0A6BF}
.spin{
  display:inline-block;width:13px;height:13px;
  border:2px solid var(--orange);border-top-color:transparent;
  border-radius:50%;animation:sp .7s linear infinite;
  vertical-align:middle;margin-right:5px
}
@keyframes sp{to{transform:rotate(360deg)}}
.back-btn{
  display:inline-block;margin-top:24px;padding:10px 24px;
  background:none;border:2px solid var(--navy);color:var(--navy);
  border-radius:10px;font-size:.85rem;font-weight:700;
  cursor:pointer;text-decoration:none;transition:background .2s,color .2s
}
.back-btn:hover{background:var(--navy);color:var(--white)}
</style>
</head>
<body>
<div class="card">
  <div class="brand">MamaCare</div>
  <h1>Berhasil Disimpan!</h1>
  <div class="lbl">Menghubungkan ke jaringan:</div>
  <div class="ssid" id="ssid-label">Rumah_WiFi</div>
  <p><span class="spin"></span>Harap tunggu sekitar 10 detik, perangkat mencoba terhubung ke WiFi.</p>
  <p class="note">Anda dapat menutup halaman ini.</p>
  <!-- Tombol kembali hanya ada di file test, tidak ada di versi ESP32 -->
  <a href="index.html" class="back-btn">&#8592; Kembali ke Form</a>
</div>
<script>
var params = new URLSearchParams(window.location.search);
var ssid = params.get('ssid');
if (ssid) { document.getElementById('ssid-label').textContent = ssid; }
</script>
</body>
</html>
